<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maanas Adiyodi | Graphic Designer</title>
  <meta name="description" content="Graphic Designer from Kerala, India. Visual storytelling through minimal, industrial design.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Default values, overridden by JS */
      --bg-base: #050f0b;
      --glass-bg: rgba(20, 53, 42, 0.4);
      --glass-border: rgba(255, 255, 255, 0.15);
      --text-primary: #f5f3ef;
      --text-secondary: #a8b5a0;
      --accent-glow-1: #135e3b;
      --accent-glow-2: #0f3325;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* --- PLUSH GRADIENT BACKGROUND --- */
    .bg-plush-container {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: var(--bg-base);
      overflow: hidden;
      transform: translateZ(0);
    }
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      will-change: transform;
      mix-blend-mode: screen;
    }
    .orb-1 {
      top: -20%; left: -10%;
      width: 60vw; height: 60vw;
      background: var(--accent-glow-1);
      animation: drift 25s ease-in-out infinite alternate;
    }
    .orb-2 {
      bottom: -30%; right: -20%;
      width: 70vw; height: 70vw;
      background: var(--accent-glow-2);
      animation: drift 30s ease-in-out infinite alternate-reverse;
    }
    @keyframes drift {
      0% { transform: translate(0, 0); }
      100% { transform: translate(5%, 5%); }
    }

    /* --- UI ELEMENTS --- */
    .font-display { font-family: 'Playfair Display', serif; }
    
    .glass-heavy {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
    }

    .card-optimized {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
      cursor: pointer;
    }

    /* --- MASONRY LAYOUT --- */
    .masonry-grid {
      column-count: 2;
      column-gap: 20px;
    }
    @media (min-width: 768px) { .masonry-grid { column-count: 3; } }
    @media (min-width: 1024px) { .masonry-grid { column-count: 4; } }

    .masonry-item {
      break-inside: avoid;
      margin-bottom: 20px;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      transform: translateZ(0);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .masonry-item img {
      width: 100%;
      height: auto;
      display: block;
      transition: transform 0.5s ease;
    }
    .masonry-item:hover {
      transform: translateY(-5px);
      border-color: var(--glass-border);
      z-index: 10;
    }
    .masonry-item:hover img { transform: scale(1.03); }

    /* --- LIGHTBOX --- */
    .lightbox-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .lightbox-overlay.active { opacity: 1; pointer-events: all; }
    .lightbox-content {
      position: relative;
      max-width: 90vw;
      max-height: 85vh;
      transform: scale(0.95);
      transition: transform 0.3s ease;
      z-index: 2;
    }
    .lightbox-overlay.active .lightbox-content { transform: scale(1); }
    .lightbox-content img {
      max-width: 100%;
      max-height: 85vh;
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      border: 1px solid var(--glass-border);
    }

    /* Controls */
    .lightbox-close {
      position: fixed; top: 30px; right: 30px;
      color: var(--text-secondary);
      font-size: 2.5rem; line-height: 1;
      background: none; border: none;
      cursor: pointer; transition: color 0.2s; z-index: 101;
    }
    .lightbox-close:hover { color: var(--text-primary); }

    .lightbox-nav {
      position: fixed; top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-primary);
      width: 50px; height: 50px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s; z-index: 101;
    }
    .lightbox-nav:hover { background: rgba(255,255,255,0.1); }
    .nav-prev { left: 30px; }
    .nav-next { right: 30px; }

    @media (max-width: 768px) {
      .lightbox-nav { top: auto; bottom: 30px; transform: none; }
      .nav-prev { left: 20px; }
      .nav-next { right: 20px; }
      .lightbox-close { top: 20px; right: 20px; }
    }

    /* --- ANIMATIONS --- */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up {
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
    }
    .delay-1 { animation-delay: 0.1s; }
    .delay-2 { animation-delay: 0.2s; }
    
    /* --- TYPOGRAPHY (TIGHTENED) --- */
    .hero-name {
      font-size: clamp(3rem, 10vw, 7rem);
      line-height: 0.9; /* Tighter line height */
      letter-spacing: -0.05em; /* Tighter letter spacing */
      margin-bottom: 0.5rem; /* Reduced margin */
    }

    .hero-subtitle {
      letter-spacing: 0.1em; /* Reduced from 0.25em */
      margin-bottom: 0.5rem; /* Reduced margin */
    }

    .link-underline {
      position: relative;
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.3s ease;
    }
    .link-underline::after {
      content: '';
      position: absolute;
      bottom: -2px; left: 0;
      width: 100%; height: 1px;
      background: var(--text-primary);
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .link-underline:hover { color: var(--text-primary); }
    .link-underline:hover::after { transform: scaleX(1); transform-origin: left; }
  </style>
</head>
<body>

  <!-- BACKGROUND -->
  <div class="bg-plush-container">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>

  <!-- NAVIGATION -->
  <nav class="fixed top-0 left-0 right-0 z-50 px-4 md:px-6 py-3 flex justify-between items-center glass-heavy mx-4 md:mx-8 mt-4 rounded-xl animate-fade-up">
    <a href="#" class="font-display text-lg md:text-xl italic tracking-wide">Maanas Adiyodi</a>
    <div class="flex items-center gap-6">
      <a href="#work" class="link-underline text-xs uppercase tracking-widest hidden md:block">Work</a>
      <a href="#contact" class="link-underline text-xs uppercase tracking-widest">Contact</a>
    </div>
  </nav>

  <!-- HERO -->
  <!-- Added text-center md:text-left for alignment -->
  <section class="min-h-screen flex flex-col justify-center px-6 md:px-10 lg:px-20 relative">
    <div class="max-w-6xl relative z-10 text-center md:text-left">
      <p class="hero-subtitle text-xs uppercase text-[var(--text-secondary)] animate-fade-up">Graphic Designer</p>
      <h1 class="hero-name font-display italic animate-fade-up delay-1">Maanas<br/>Adiyodi</h1>
      <!-- Added justify-center md:justify-start for the line/text group -->
      <div class="flex items-center gap-4 animate-fade-up delay-2 justify-center md:justify-start">
        <div class="w-8 h-px bg-[var(--text-secondary)] opacity-50 hidden md:block"></div> <!-- Hidden on mobile, visible on desktop -->
        <p class="text-sm text-[var(--text-secondary)] tracking-wide">Kerala, India</p>
      </div>
    </div>
    <div class="absolute bottom-10 left-1/2 -translate-x-1/2 flex flex-col items-center gap-3 opacity-50 animate-fade-up delay-2">
      <span class="text-xs uppercase tracking-widest text-[var(--text-secondary)]">Scroll</span>
      <svg width="16" height="24" viewBox="0 0 16 24" fill="none" stroke="currentColor" stroke-width="1" class="text-[var(--text-secondary)]"><rect x="1" y="1" width="14" height="22" rx="7"/><line x1="8" y1="6" x2="8" y2="10"/></svg>
    </div>
  </section>

  <!-- SECTION 1: DES1GN.ANYTHIN -->
  <section id="work" class="py-24 px-4 md:px-8 lg:px-16">
    <div class="max-w-7xl mx-auto">
      <div class="mb-12 px-4 flex justify-between items-end">
        <div>
          <p class="text-xs uppercase tracking-widest text-[var(--text-secondary)] mb-2">Creative Direction</p>
          <h2 class="font-display text-3xl md:text-4xl italic">@des1gn.anythin</h2>
        </div>
        <a href="https://instagram.com/des1gn.anythin" target="_blank" class="text-xs uppercase tracking-widest text-[var(--text-secondary)] hover:text-white transition-colors hidden md:block">View Profile &rarr;</a>
      </div>

      <div class="masonry-grid">
        <article class="masonry-item card-optimized"><img src="2.jpg" alt="Des1gn Work 1" loading="lazy"></article>
        <article class="masonry-item card-optimized"><img src="3.png" alt="Des1gn Work 2" loading="lazy"></article>
        <article class="masonry-item card-optimized"><img src="4.jpg" alt="Des1gn Work 3" loading="lazy"></article>
        <article class="masonry-item card-optimized"><img src="5.jpeg" alt="Des1gn Work 4" loading="lazy"></article>
      </div>
    </div>
  </section>

  <!-- SECTION 2: CARS.GFX -->
  <section class="py-24 px-4 md:px-8 lg:px-16 border-t border-[rgba(255,255,255,0.05)]">
    <div class="max-w-7xl mx-auto">
      <div class="mb-12 px-4 flex justify-between items-end">
        <div>
          <p class="text-xs uppercase tracking-widest text-[var(--text-secondary)] mb-2">Automotive Art</p>
          <h2 class="font-display text-3xl md:text-4xl italic">@cars.gfx</h2>
        </div>
        <a href="https://instagram.com/cars.gfx" target="_blank" class="text-xs uppercase tracking-widest text-[var(--text-secondary)] hover:text-white transition-colors hidden md:block">View Profile &rarr;</a>
      </div>

      <div class="masonry-grid">
        <article class="masonry-item card-optimized"><img src="7.jpg" alt="Cars Work 1" loading="lazy"></article>
        <article class="masonry-item card-optimized"><img src="6.jpg" alt="Cars Work 2" loading="lazy"></article>
        <article class="masonry-item card-optimized"><img src="1.jpg" alt="Cars Work 3" loading="lazy"></article>
      </div>
    </div>
  </section>

  <!-- FOOTER -->
  <footer id="contact" class="py-16 px-4 md:px-8 lg:px-16 relative z-10">
     <div class="max-w-7xl mx-auto">
        <div class="glass-heavy rounded-2xl p-8 md:p-12 grid md:grid-cols-2 gap-8 items-center">
           <div>
              <p class="text-xs uppercase tracking-widest text-[var(--text-secondary)] mb-3">Get in touch</p>
              <a href="https://instagram.com/adichitodi" target="_blank" rel="noopener noreferrer" class="font-display text-2xl md:text-3xl italic hover:text-white transition-colors">@adichitodi</a>
           </div>
           <div class="md:text-right">
              <p class="text-xs uppercase tracking-widest text-[var(--text-secondary)] mb-3">Location</p>
              <p class="text-lg text-[var(--text-primary)]">Kerala, India</p>
           </div>
        </div>
        
        <div class="flex justify-between items-center mt-6 text-xs text-[var(--text-secondary)] opacity-60 px-4">
           <p>Maanas Adiyodi</p>
           <p id="year-display"></p>
        </div>
     </div>
  </footer>

  <!-- LIGHTBOX -->
  <div class="lightbox-overlay" id="lightbox">
    <button class="lightbox-close" id="close-lightbox">&times;</button>
    
    <button class="lightbox-nav nav-prev" id="prev-img">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M15 18l-6-6 6-6"/></svg>
    </button>

    <div class="lightbox-content">
      <img src="" alt="Enlarged view" id="lightbox-img">
    </div>

    <button class="lightbox-nav nav-next" id="next-img">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <script>
    // --- 1. DYNAMIC THEME ENGINE ---
    const themes = [
      { // Emerald
        base: '#050f0b', glass: 'rgba(20, 53, 42, 0.4)', border: 'rgba(255, 255, 255, 0.15)',
        secondary: '#a8b5a0', glow1: '#135e3b', glow2: '#0f3325'
      },
      { // Midnight Blue
        base: '#070914', glass: 'rgba(30, 41, 59, 0.4)', border: 'rgba(148, 163, 184, 0.15)',
        secondary: '#94a3b8', glow1: '#1e40af', glow2: '#172554'
      },
      { // Graphite
        base: '#0a0a0a', glass: 'rgba(38, 38, 38, 0.4)', border: 'rgba(163, 163, 163, 0.15)',
        secondary: '#a3a3a3', glow1: '#404040', glow2: '#171717'
      },
      { // Wine
        base: '#140505', glass: 'rgba(69, 20, 20, 0.4)', border: 'rgba(253, 164, 175, 0.15)',
        secondary: '#fecdd3', glow1: '#881337', glow2: '#4c0519'
      },
      { // Cosmic Purple
        base: '#0d0514', glass: 'rgba(46, 27, 67, 0.4)', border: 'rgba(216, 180, 254, 0.15)',
        secondary: '#d8b4fe', glow1: '#581c87', glow2: '#2e1065'
      }
    ];

    const randomTheme = themes[Math.floor(Math.random() * themes.length)];
    const root = document.documentElement;

    root.style.setProperty('--bg-base', randomTheme.base);
    root.style.setProperty('--glass-bg', randomTheme.glass);
    root.style.setProperty('--glass-border', randomTheme.border);
    root.style.setProperty('--text-secondary', randomTheme.secondary);
    root.style.setProperty('--accent-glow-1', randomTheme.glow1);
    root.style.setProperty('--accent-glow-2', randomTheme.glow2);


    // --- 2. CORE LOGIC ---
    document.getElementById('year-display').textContent = new Date().getFullYear();

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');
    const allItems = document.querySelectorAll('.masonry-item');
    
    let currentIndex = 0;
    const imageSources = [];

    allItems.forEach(item => {
      const img = item.querySelector('img');
      imageSources.push(img.src);
    });

    function openLightbox(index) {
      currentIndex = index;
      lightboxImg.src = imageSources[currentIndex];
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
    }

    function nextImage() {
      currentIndex = (currentIndex + 1) % imageSources.length;
      lightboxImg.src = imageSources[currentIndex];
    }

    function prevImage() {
      currentIndex = (currentIndex - 1 + imageSources.length) % imageSources.length;
      lightboxImg.src = imageSources[currentIndex];
    }

    allItems.forEach((item, index) => {
      item.addEventListener('click', () => openLightbox(index));
    });

    document.getElementById('close-lightbox').addEventListener('click', closeLightbox);
    document.getElementById('next-img').addEventListener('click', nextImage);
    document.getElementById('prev-img').addEventListener('click', prevImage);

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowRight') nextImage();
      if (e.key === 'ArrowLeft') prevImage();
    });

    // --- Scroll Reveal ---
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });

    allItems.forEach((item, index) => {
      item.style.opacity = '0';
      item.style.transform = 'translateY(20px)';
      item.style.transition = `opacity 0.5s ease ${index * 0.03}s, transform 0.5s ease ${index * 0.03}s`;
      observer.observe(item);
    });

    const style = document.createElement('style');
    style.innerHTML = `.is-visible { opacity: 1 !important; transform: translateY(0) !important; }`;
    document.head.appendChild(style);

    // Smooth Scroll
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();
        document.querySelector(this.getAttribute('href')).scrollIntoView({ behavior: 'smooth' });
      });
    });
  </script>
</body>
</html>
