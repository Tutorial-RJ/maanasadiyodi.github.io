<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maanas Adiyodi - Visual Tales</title>
    <meta name="description" content="Visual storytelling through posters and custom design. Maanas Adiyodi creates bold narratives visually.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pangolin&family=JetBrains+Mono:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome for doodle icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        :root {
            --light-bg: #fbfaba;
            --dark-bg: #000001;
            --accent-primary: #ce9131;
            --accent-secondary: #552d2c;
            --text-light: #552d2c;
            --text-dark: #fbfaba;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--light-bg);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
            transition: all 0.4s ease;
        }

        body.dark-mode {
            background: var(--dark-bg);
            color: var(--text-dark);
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: var(--light-bg);
        }
        body.dark-mode ::-webkit-scrollbar-track {
            background: var(--dark-bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 5px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-secondary);
        }

        /* Theme Toggle Button */
        .theme-toggle {
            position: fixed;
            top: 2rem;
            right: 2rem;
            z-index: 999;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--accent-primary);
            border: 3px solid var(--accent-secondary);
            color: var(--light-bg);
            font-size: 1.8rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        body.dark-mode .theme-toggle {
            background: var(--accent-secondary);
            color: var(--accent-primary);
        }

        .theme-toggle:hover {
            transform: scale(1.15) rotate(20deg);
            box-shadow: 0 4px 15px rgba(206, 145, 49, 0.4);
        }

        /* Background Elements - VISIBLE AND ANIMATED */
        .bg-elements {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .bg-shape {
            position: absolute;
            animation: float-shape 8s ease-in-out infinite;
        }

        @keyframes float-shape {
            0%, 100% { 
                transform: translateY(0px) translateX(0px) rotate(0deg) scale(1);
                opacity: 0.15;
            }
            25% { 
                transform: translateY(-50px) translateX(30px) rotate(15deg) scale(1.05);
                opacity: 0.2;
            }
            50% { 
                transform: translateY(-100px) translateX(-20px) rotate(45deg) scale(0.95);
                opacity: 0.25;
            }
            75% { 
                transform: translateY(-50px) translateX(-40px) rotate(30deg) scale(1.1);
                opacity: 0.2;
            }
        }

        /* Circle shape */
        .shape-1 {
            width: 300px;
            height: 300px;
            background: var(--accent-primary);
            border-radius: 50%;
            top: 5%;
            left: 5%;
            animation-delay: 0s;
            animation-duration: 12s;
        }

        /* Organic blob */
        .shape-2 {
            width: 280px;
            height: 280px;
            background: var(--accent-secondary);
            border-radius: 30% 70% 70% 30%;
            top: 50%;
            right: 5%;
            animation-delay: 2s;
            animation-duration: 15s;
        }

        /* Hexagon */
        .shape-3 {
            width: 200px;
            height: 200px;
            background: var(--accent-primary);
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            bottom: 10%;
            left: 10%;
            animation-delay: 4s;
            animation-duration: 16s;
        }

        /* Curved shape */
        .shape-4 {
            width: 200px;
            height: 280px;
            background: var(--accent-secondary);
            border-radius: 60% 40% 30% 70%;
            top: 20%;
            right: 15%;
            animation-delay: 1s;
            animation-duration: 13s;
        }

        /* Square rotated */
        .shape-5 {
            width: 220px;
            height: 220px;
            background: var(--accent-primary);
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
            bottom: 20%;
            right: 20%;
            animation-delay: 3s;
            animation-duration: 14s;
            transform: rotate(45deg);
        }

        /* Small circle */
        .shape-6 {
            width: 150px;
            height: 150px;
            background: var(--accent-secondary);
            border-radius: 50%;
            top: 60%;
            left: 3%;
            animation-delay: 5s;
            animation-duration: 17s;
        }

        /* Teardrop */
        .shape-7 {
            width: 180px;
            height: 200px;
            background: var(--accent-primary);
            border-radius: 50% 50% 50% 0;
            bottom: 30%;
            left: 50%;
            animation-delay: 2s;
            animation-duration: 18s;
            transform: rotate(45deg);
        }

        /* Star-like shape */
        .shape-8 {
            width: 160px;
            height: 160px;
            background: var(--accent-secondary);
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            top: 15%;
            left: 70%;
            animation-delay: 1s;
            animation-duration: 16s;
        }

        /* Header/Hero */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, var(--light-bg) 0%, #faf0e0 100%);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        body.dark-mode .hero {
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a0f0f 100%);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 900px;
        }

        .hero h1 {
            font-family: 'Pangolin', cursive;
            font-size: clamp(3.5rem, 12vw, 8rem);
            font-weight: 400;
            letter-spacing: -1px;
            margin-bottom: 0.8rem;
            color: var(--text-light);
            line-height: 0.9;
            text-transform: none;
            word-spacing: 0.1em;
        }

        body.dark-mode .hero h1 {
            color: var(--text-dark);
        }

        .hero-subtitle {
            font-family: 'Space Mono', monospace;
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--accent-primary);
            margin-bottom: 0.8rem;
            font-weight: 400;
            word-spacing: 0.3em;
        }

        .cta-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .cta-btn {
            padding: 0.85rem 2rem;
            border: 2px solid var(--accent-primary);
            background: var(--accent-primary);
            color: var(--light-bg);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-transform: none;
            letter-spacing: 0.1em;
        }

        body.dark-mode .cta-btn {
            color: var(--dark-bg);
        }

        .cta-btn:hover {
            background: var(--accent-secondary);
            border-color: var(--accent-secondary);
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(206, 145, 49, 0.3);
        }

        .cta-btn.secondary {
            background: transparent;
            color: var(--accent-primary);
            border-color: var(--accent-primary);
            font-size: 0.85rem;
            padding: 0.6rem 1.2rem;
        }

        .cta-btn.secondary:hover {
            background: var(--accent-primary);
            color: var(--light-bg);
        }

        body.dark-mode .cta-btn.secondary {
            color: var(--text-dark);
        }

        body.dark-mode .cta-btn.secondary:hover {
            color: var(--dark-bg);
        }

        .cta-btn.primary {
            font-size: 1rem;
            padding: 0.95rem 2.5rem;
        }

        .scroll-hint {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent-primary);
            animation: pulse 2s ease-in-out infinite;
            opacity: 0.6;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.7; }
        }

        /* Pinterest Grid */
        .works-section {
            padding: 4rem 2rem;
            background: var(--light-bg);
            position: relative;
            z-index: 1;
        }

        body.dark-mode .works-section {
            background: var(--dark-bg);
        }

        .works-header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
            z-index: 2;
        }

        .works-header h2 {
            font-family: 'Pangolin', cursive;
            font-size: clamp(2rem, 6vw, 3.5rem);
            color: var(--text-light);
            margin-bottom: 0.8rem;
            font-weight: 400;
            text-transform: none;
            letter-spacing: -0.5px;
        }

        body.dark-mode .works-header h2 {
            color: var(--text-dark);
        }

        .works-header p {
            font-family: 'Space Mono', monospace;
            font-size: 0.95rem;
            color: var(--accent-primary);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 500;
            opacity: 0.8;
        }

        .masonry-grid {
            column-count: 1;
            column-gap: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        @media (min-width: 768px) {
            .masonry-grid {
                column-count: 2;
            }
        }

        @media (min-width: 1024px) {
            .masonry-grid {
                column-count: 3;
            }
        }

        .work-item {
            break-inside: avoid;
            margin-bottom: 1.5rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            background: white;
            box-shadow: 0 4px 12px rgba(85, 45, 44, 0.08);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border: 2px solid var(--accent-primary);
        }

        body.dark-mode .work-item {
            background: #1a1a1a;
            box-shadow: 0 4px 12px rgba(206, 145, 49, 0.1);
            border-color: var(--accent-secondary);
        }

        .work-item:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(206, 145, 49, 0.2);
        }

        .work-image {
            width: 100%;
            height: auto;
            display: block;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 6px;
        }

        .work-item:hover .work-image {
            transform: scale(1.05);
        }

        .work-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(85, 45, 44, 0.9), transparent);
            opacity: 0;
            transition: opacity 0.4s ease;
            display: flex;
            align-items: flex-end;
            padding: 1.5rem;
            border-radius: 6px;
        }

        body.dark-mode .work-overlay {
            background: linear-gradient(to top, rgba(206, 145, 49, 0.8), transparent);
        }

        .work-item:hover .work-overlay {
            opacity: 1;
        }

        .work-info {
            color: var(--text-dark);
            transform: translateY(10px);
            transition: transform 0.4s ease;
        }

        body.dark-mode .work-info {
            color: var(--dark-bg);
        }

        .work-item:hover .work-info {
            transform: translateY(0);
        }

        .work-info h3 {
            font-family: 'Pangolin', cursive;
            font-size: 1.4rem;
            margin-bottom: 0.3rem;
            text-transform: none;
            letter-spacing: 0.05em;
        }

        .work-info p {
            font-size: 0.85rem;
            opacity: 0.9;
            font-family: 'Space Mono', monospace;
            letter-spacing: 0.05em;
        }

        /* Lightbox */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 1, 0.95);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            animation: fadeIn 0.3s ease;
        }

        .lightbox.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .lightbox-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .lightbox-img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 8px;
        }

        .lightbox-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            width: 44px;
            height: 44px;
            background: rgba(206, 145, 49, 0.2);
            border: none;
            color: var(--text-dark);
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 1001;
            font-weight: bold;
        }

        .lightbox-close:hover {
            background: rgba(206, 145, 49, 0.4);
            transform: rotate(90deg);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            background: rgba(206, 145, 49, 0.2);
            border: none;
            color: var(--text-dark);
            font-size: 1.5rem;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 1001;
            font-weight: bold;
        }

        .lightbox-nav:hover {
            background: rgba(206, 145, 49, 0.4);
        }

        .lightbox-prev {
            left: 1rem;
        }

        .lightbox-next {
            right: 1rem;
        }

        /* Footer */
        .footer {
            background: var(--accent-secondary);
            padding: 3.5rem 2rem;
            border-top: 2px solid var(--accent-primary);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        body.dark-mode .footer {
            background: #1a1a1a;
            border-top-color: var(--accent-primary);
        }

        .footer-content {
            max-width: 800px;
            margin: 0 auto;
        }

        .footer-title {
            font-family: 'Pangolin', cursive;
            font-size: clamp(1.8rem, 5vw, 3rem);
            color: var(--text-dark);
            margin-bottom: 0.5rem;
            text-transform: none;
            letter-spacing: -0.5px;
        }

        body.dark-mode .footer-title {
            color: var(--text-dark);
        }

        .footer-subtitle {
            font-family: 'Space Mono', monospace;
            font-size: 0.9rem;
            color: var(--text-dark);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 2rem;
            font-weight: 500;
            opacity: 0.8;
        }

        body.dark-mode .footer-subtitle {
            color: var(--accent-primary);
        }

        .contact-links {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 0;
            align-items: center;
        }

        .contact-link {
            text-decoration: none;
            color: var(--text-dark);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 600;
            padding: 0.6rem 1.2rem;
            border: 2px solid var(--text-dark);
            border-radius: 4px;
            transition: all 0.3s ease;
            letter-spacing: 0.05em;
        }

        body.dark-mode .contact-link {
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        .contact-link:hover {
            background: var(--text-dark);
            color: var(--accent-secondary);
        }

        body.dark-mode .contact-link:hover {
            background: var(--accent-primary);
            color: var(--dark-bg);
        }

        .contact-link.primary {
            background: var(--accent-primary);
            color: var(--light-bg);
            border-color: var(--accent-primary);
            font-size: 1.1rem;
            padding: 0.8rem 2rem;
        }

        .contact-link.primary:hover {
            background: var(--accent-secondary);
            border-color: var(--accent-secondary);
        }

        body.dark-mode .contact-link.primary {
            background: var(--accent-primary);
            color: var(--dark-bg);
            border-color: var(--accent-primary);
        }

        .contact-link.secondary {
            font-size: 0.8rem;
            padding: 0.5rem 0.8rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }

            .works-header h2 {
                font-size: 2rem;
            }

            .cta-group {
                flex-direction: column;
            }

            .cta-btn {
                width: 100%;
            }

            .contact-links {
                flex-direction: column;
            }

            .contact-link {
                width: 100%;
            }

            .theme-toggle {
                top: 1rem;
                right: 1rem;
                width: 55px;
                height: 55px;
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background Elements - NOW VISIBLE WITH MOVEMENT -->
    <div class="bg-elements">
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>
        <div class="bg-shape shape-3"></div>
        <div class="bg-shape shape-4"></div>
        <div class="bg-shape shape-5"></div>
        <div class="bg-shape shape-6"></div>
        <div class="bg-shape shape-7"></div>
        <div class="bg-shape shape-8"></div>
    </div>

    <!-- Theme Toggle Button - DOODLE STYLE ICON -->
    <button class="theme-toggle" id="theme-toggle" title="Toggle Dark/Light Mode">
        <i class="fas fa-sun"></i>
    </button>

    <!-- Hero Section -->
    <section class="hero" id="top">
        <div class="hero-content">
            <h1>Maanas<br>Adiyodi</h1>
            <p class="hero-subtitle">Visual Tales</p>
            
            <div class="cta-group">
                <a href="https://instagram.com/adichitodi" target="_blank" class="cta-btn primary">@adichitodi</a>
                <a href="https://instagram.com/des1gn.anythin" target="_blank" class="cta-btn secondary">@des1gn.anythin</a>
                <a href="https://instagram.com/cars.gfx" target="_blank" class="cta-btn secondary">@cars.gfx</a>
            </div>
        </div>

        <p class="scroll-hint">Scroll to view work</p>
    </section>

    <!-- Works Section -->
    <section class="works-section">
        <div class="works-header">
            <h2>Featured works</h2>
            <p>Posters & Custom Design</p>
        </div>

        <div class="masonry-grid" id="masonry">
            <!-- Will be populated by JavaScript -->
        </div>
    </section>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <div class="lightbox-content">
            <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
            <button class="lightbox-nav lightbox-prev" onclick="prevImage()">&#10094;</button>
            <img class="lightbox-img" id="lightbox-img" src="" alt="">
            <button class="lightbox-nav lightbox-next" onclick="nextImage()">&#10095;</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <h3 class="footer-title">Let's create</h3>
            <p class="footer-subtitle">Get in touch for custom projects</p>
            
            <div class="contact-links">
                <a href="https://instagram.com/adichitodi" target="_blank" class="contact-link primary">@adichitodi</a>
                <a href="https://instagram.com/des1gn.anythin" target="_blank" class="contact-link secondary">@des1gn.anythin</a>
                <a href="https://instagram.com/cars.gfx" target="_blank" class="contact-link secondary">@cars.gfx</a>
                <a href="mailto:maanas.rsuresh@gmail.com" class="contact-link secondary">Email</a>
            </div>
        </div>
    </footer>

    <script>
        // Theme Toggle
        const themeToggle = document.getElementById('theme-toggle');
        const htmlElement = document.documentElement;

        // Check for saved theme preference or default to light mode
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-mode');
            themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
        } else {
            themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
        }

        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const isDarkMode = document.body.classList.contains('dark-mode');
            localStorage.setItem('theme', isDarkMode ? 'dark' : 'light');
            themeToggle.innerHTML = isDarkMode ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
        });

        const works = [
            { image: '1.jpg', title: 'Narrative one', category: 'Poster' },
            { image: '2.jpg', title: 'Visual tale two', category: 'Poster' },
            { image: '3.jpg', title: 'Story three', category: 'Custom Design' },
            { image: '4.jpg', title: 'Expression four', category: 'Poster' },
            { image: '5.jpg', title: 'Creation five', category: 'Custom Design' },
            { image: '6.jpg', title: 'Vision six', category: 'Poster' },
            { image: '7.jpg', title: 'Concept seven', category: 'Custom Design' }
        ];

        let currentIndex = 0;
        let images = works.map(w => w.image);

        // Populate Masonry Grid
        const masonry = document.getElementById('masonry');
        works.forEach((work, index) => {
            const item = document.createElement('div');
            item.className = 'work-item';
            item.innerHTML = `
                <img src="${work.image}" alt="${work.title}" class="work-image">
                <div class="work-overlay">
                    <div class="work-info">
                        <h3>${work.title}</h3>
                        <p>${work.category}</p>
                    </div>
                </div>
            `;
            item.addEventListener('click', () => openLightbox(index));
            masonry.appendChild(item);
        });

        // Lightbox Functions
        function openLightbox(index) {
            currentIndex = index;
            document.getElementById('lightbox-img').src = images[currentIndex];
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
        }

        function nextImage() {
            currentIndex = (currentIndex + 1) % images.length;
            document.getElementById('lightbox-img').src = images[currentIndex];
        }

        function prevImage() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            document.getElementById('lightbox-img').src = images[currentIndex];
        }

        // Keyboard Navigation
        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') nextImage();
            if (e.key === 'ArrowLeft') prevImage();
        });

        // Close lightbox on background click
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') closeLightbox();
        });
    </script>

</body>
</html>
