<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Maanas Adiyodi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Patrick+Hand&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #faf8f4;
            --text: #2a2520;
            --text-muted: #7a7268;
            --paper: #fffcf7;
            --accent: #d97a4a;
            --accent2: #4a8c7a;
            --border: 2.5px solid #2a2520;
            --shadow: 6px 6px 0px #2a2520;
        }

        html {
            height: 100vh;
            overflow: hidden;
        }

        body {
            font-family: 'Instrument Serif', serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }

        /* ── CANVAS ── */
        #bgCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.2;
            mix-blend-mode: multiply;
        }

        /* ── SLIDES WRAPPER ── */
        .slides-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            z-index: 1;
        }

        /* ── SLIDES CONTAINER (animated) ── */
        .slides-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            transition: transform 0.8s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
        }

        /* ── SLIDES ── */
        .slide {
            flex: 0 0 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem 1.2rem;
            position: relative;
            overflow: hidden;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            padding: 0 0.5rem;
        }

        /* ── HERO ── */
        .hero {
            text-align: center;
        }

        .hero::after {
            content: "~~~~~~~~";
            position: absolute;
            bottom: 2.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1rem;
            color: var(--accent);
            letter-spacing: 0.15rem;
            opacity: 0.25;
            font-family: 'Patrick Hand', cursive;
            white-space: nowrap;
        }

        .hero-title {
            display: inline-block;
            position: relative;
            margin-bottom: 0.1rem;
        }

        .hero-title .title-text {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(2.8rem, 12vw, 5.5rem);
            font-weight: 400;
            line-height: 0.9;
            background: linear-gradient(to bottom, #2a2520 0%, #d97a4a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
            letter-spacing: -0.02em;
        }

        .hero-title .title-text:last-child {
            background: linear-gradient(to bottom, #2a2520 0%, #4a8c7a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-title::after {
            content: "";
            position: absolute;
            bottom: 0.15rem;
            left: 5%;
            width: 90%;
            height: 4px;
            background: var(--accent);
            opacity: 0.25;
            border-radius: 50%;
            transform: rotate(-1deg);
            pointer-events: none;
        }

        .sub {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(0.9rem, 2.5vw, 1.2rem);
            color: var(--text-muted);
            letter-spacing: 0.04em;
            font-weight: 400;
            margin-top: 0.3rem;
        }

        .scroll-hint {
            margin-top: 2rem;
            font-family: 'Patrick Hand', cursive;
            font-size: 0.7rem;
            color: var(--text-muted);
            opacity: 0.4;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(5px); }
        }

        /* ── WORKS ── */
        .works-section {
            padding: 0.5rem 0;
            width: 100%;
            height: 100%;
            justify-content: flex-start;
            padding-top: 1.5rem;
        }

        .section-header {
            text-align: center;
            margin-bottom: 1.2rem;
            padding-bottom: 0.4rem;
            border-bottom: var(--border);
            position: relative;
            flex-shrink: 0;
        }

        .section-header::after {
            content: "⚡⚡⚡";
            position: absolute;
            bottom: -0.5rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.6rem;
            color: var(--accent2);
            letter-spacing: 0.2rem;
            opacity: 0.25;
        }

        .section-header h2 {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem;
            justify-items: center;
            width: 100%;
            max-height: 60vh;
            overflow-y: auto;
            padding: 0.3rem 0.2rem 0.8rem;
            -webkit-overflow-scrolling: touch;
        }

        .grid::-webkit-scrollbar {
            width: 3px;
        }
        .grid::-webkit-scrollbar-track {
            background: transparent;
        }
        .grid::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 3px;
        }

        @media (min-width: 500px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 1rem;
            }
        }

        @media (min-width: 768px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 1.5rem;
                max-height: 70vh;
            }
        }

        .work-card {
            background: var(--paper);
            border: var(--border);
            box-shadow: var(--shadow);
            cursor: pointer;
            overflow: hidden;
            transition: all 0.2s ease;
            transform: rotate(var(--rot, 0deg));
            position: relative;
            width: 100%;
            max-width: 280px;
            touch-action: manipulation;
        }

        .work-card:nth-child(4n+1) { --rot: -1.2deg; }
        .work-card:nth-child(4n+2) { --rot: 1.5deg; }
        .work-card:nth-child(4n+3) { --rot: -0.6deg; }
        .work-card:nth-child(4n+4) { --rot: 1.2deg; }

        .work-card:active {
            transform: scale(0.97) rotate(0deg) !important;
        }

        .work-card::before {
            content: "✦";
            position: absolute;
            top: -0.2rem;
            right: -0.2rem;
            font-size: 0.9rem;
            color: var(--accent2);
            opacity: 0.4;
            transform: rotate(12deg);
            z-index: 2;
        }

        .card-img {
            width: 100%;
            height: auto;
            display: block;
            vertical-align: bottom;
            filter: grayscale(0.1);
            transition: filter 0.25s ease;
            aspect-ratio: auto;
        }

        .work-card:active .card-img {
            filter: grayscale(0);
        }

        /* ── CONTACT ── */
        .contact-slide {
            text-align: center;
            padding: 1.5rem 1.2rem;
        }

        .contact-slide .contact-title {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(2.2rem, 8vw, 3.8rem);
            font-weight: 400;
            margin-bottom: 1rem;
            letter-spacing: 0.02em;
        }

        .contact-slide .contact-title span {
            background: linear-gradient(to bottom, #2a2520 0%, #d97a4a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .contact-divider {
            width: 50px;
            height: 3px;
            background: var(--accent);
            margin: 0 auto 1.5rem;
            opacity: 0.3;
            border-radius: 50%;
        }

        .contact-item {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(1rem, 2.5vw, 1.3rem);
            margin: 0.6rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .contact-item a {
            color: var(--text);
            text-decoration: none;
            border-bottom: 2px dotted var(--accent);
            padding-bottom: 0.05rem;
            transition: border-color 0.2s;
            word-break: break-all;
        }

        .contact-item a:active {
            border-color: var(--text);
        }

        .contact-item i {
            color: var(--accent);
            font-size: 1rem;
            width: 1.3rem;
            text-align: center;
            flex-shrink: 0;
        }

        /* ── STATIC SOCIAL LINKS (replaces scroll) ── */
        .social-static {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 1.2rem auto 0;
            padding: 0.5rem;
        }

        .social-static .social-link {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            padding: 0.4rem 1.4rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text);
            text-decoration: none;
            border: var(--border);
            box-shadow: var(--shadow);
            background: var(--paper);
            transition: all 0.15s ease;
            touch-action: manipulation;
        }

        .social-static .social-link:active {
            background: var(--accent);
            color: #fff;
            transform: scale(0.95);
        }

        .social-static .social-link i {
            font-size: 0.9rem;
        }

        /* ── LIGHTBOX ── */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            touch-action: none;
        }

        .lightbox.active {
            display: flex;
        }

        .lb-container {
            position: relative;
            max-width: 95vw;
            max-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .lb-img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border: var(--border);
            box-shadow: 12px 12px 0px var(--accent);
            background: var(--paper);
            width: auto;
            height: auto;
        }

        .lb-close {
            background: var(--paper);
            color: var(--text);
            border: var(--border);
            box-shadow: var(--shadow);
            font-size: 1rem;
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            position: absolute;
            font-family: 'Instrument Serif', serif;
            top: 0.5rem;
            right: 0.5rem;
            z-index: 10;
            touch-action: manipulation;
        }

        .lb-close:active {
            background: var(--accent);
            color: #fff;
            transform: scale(0.92);
        }

        /* ── PROGRESS DOTS ── */
        .progress-dots {
            position: fixed;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            pointer-events: none;
        }

        .progress-dots .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            border: var(--border);
            background: var(--bg);
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            pointer-events: auto;
            cursor: pointer;
        }

        .progress-dots .dot.active {
            background: var(--accent);
            transform: scale(1.3);
            border-color: var(--accent);
        }

        .progress-dots .dot:active {
            transform: scale(0.8);
        }

        @media (max-width: 600px) {
            .progress-dots {
                right: 0.5rem;
                gap: 0.4rem;
            }
            .progress-dots .dot {
                width: 6px;
                height: 6px;
            }
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 400px) {
            .slide { padding: 1rem 0.8rem; }
            .hero::after { font-size: 0.7rem; bottom: 1.8rem; }
            .hero-title .title-text { font-size: clamp(2.2rem, 10vw, 2.8rem); }
            .grid { gap: 0.5rem; max-height: 55vh; }
            .work-card { max-width: 140px; }
            .work-card::before { display: none; }
            .contact-slide .contact-title { font-size: clamp(1.8rem, 7vw, 2.4rem); }
            .contact-item { font-size: 0.85rem; }
            .social-static .social-link { font-size: 0.75rem; padding: 0.3rem 0.9rem; }
            .social-static { gap: 0.6rem; }
        }

        @media (min-width: 401px) and (max-width: 600px) {
            .grid { gap: 0.7rem; }
            .work-card { max-width: 170px; }
        }

        @media (orientation: landscape) and (max-height: 500px) {
            .slide { padding: 0.8rem 1rem; }
            .hero::after { display: none; }
            .hero-title .title-text { font-size: clamp(1.8rem, 6vw, 2.8rem); }
            .scroll-hint { display: none; }
            .grid { max-height: 50vh; }
            .section-header { margin-bottom: 0.5rem; }
            .section-header h2 { font-size: clamp(1.4rem, 3vw, 2rem); }
            .contact-slide .contact-title { font-size: clamp(1.6rem, 4vw, 2.4rem); }
            .contact-divider { margin: 0.5rem auto; }
            .social-static { margin: 0.5rem auto 0; }
            .social-static .social-link { padding: 0.2rem 0.8rem; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <!-- Canvas -->
    <canvas id="bgCanvas"></canvas>

    <!-- Progress Dots -->
    <div class="progress-dots" id="progressDots">
        <div class="dot active" data-index="0"></div>
        <div class="dot" data-index="1"></div>
        <div class="dot" data-index="2"></div>
    </div>

    <!-- SLIDES WRAPPER -->
    <div class="slides-wrapper">
        <div class="slides-container" id="slidesContainer">

            <!-- SLIDE 1: HERO -->
            <section class="slide hero" id="home">
                <div class="container">
                    <div class="hero-title">
                        <span class="title-text">Maanas</span>
                        <span class="title-text">Adiyodi</span>
                    </div>
                    <div class="sub">poster artifacts · experimental</div>
                    <div class="scroll-hint">↓ scroll</div>
                </div>
            </section>

            <!-- SLIDE 2: WORKS -->
            <section class="slide works-section" id="works">
                <div class="container">
                    <div class="section-header">
                        <h2>Works</h2>
                    </div>
                    <div class="grid" id="dynamicGrid"></div>
                </div>
            </section>

            <!-- SLIDE 3: CONTACT -->
            <section class="slide contact-slide" id="contact">
                <div class="container">
                    <div class="contact-title"><span>let's create</span></div>
                    <div class="contact-divider"></div>
                    <div class="contact-item">
                        <i class="fa-regular fa-envelope"></i>
                        <a href="mailto:maanas.rsuresh@gmail.com">maanas.rsuresh@gmail.com</a>
                    </div>
                    <div class="social-static" id="socialStatic">
                        <!-- injected by JS -->
                    </div>
                </div>
            </section>

        </div>
    </div>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightboxModal">
        <div class="lb-container">
            <button class="lb-close" id="closeLightboxBtn"><i class="fa-solid fa-xmark"></i></button>
            <img class="lb-img" id="lightboxImage" alt="Enlarged artwork" />
        </div>
    </div>

    <script>
        // ── SOCIAL LINKS ──
        const socialLinks = [
            { icon: 'fa-instagram', label: '@adichitodi', url: 'https://instagram.com/adichitodi' },
            { icon: 'fa-pinterest', label: 'Pinterest', url: 'https://www.pinterest.com/des1gnanythin/' },
        ];

        // ── DOM REFS ──
        const grid = document.getElementById('dynamicGrid');
        const lightboxModal = document.getElementById('lightboxModal');
        const lightboxImg = document.getElementById('lightboxImage');
        const closeBtn = document.getElementById('closeLightboxBtn');
        const socialStatic = document.getElementById('socialStatic');
        const slidesContainer = document.getElementById('slidesContainer');
        const dots = document.querySelectorAll('.dot');

        let worksData = [];
        let currentSlide = 0;
        const totalSlides = 3;
        let isAnimating = false;

        // ── AUTO-DETECT IMAGES ──
        async function discoverImages() {
            const extensions = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'avif', 'bmp'];
            const found = [];
            
            for (let i = 1; i <= 50; i++) {
                let foundAny = false;
                for (const ext of extensions) {
                    const filename = `${i}.${ext}`;
                    try {
                        const resp = await fetch(filename, { method: 'HEAD' });
                        if (resp.ok) {
                            found.push(filename);
                            foundAny = true;
                            break;
                        }
                    } catch (e) { /* skip */ }
                }
                if (!foundAny && found.length > 0) break;
            }
            
            if (found.length > 0) {
                console.log(`✅ Found ${found.length} images`);
                return found;
            }
            
            const common = ['cover', 'banner', 'main', 'hero', 'featured'];
            for (const name of common) {
                for (const ext of extensions) {
                    const filename = `${name}.${ext}`;
                    try {
                        const resp = await fetch(filename, { method: 'HEAD' });
                        if (resp.ok) {
                            found.push(filename);
                            break;
                        }
                    } catch (e) { /* skip */ }
                }
            }
            
            if (found.length > 0) {
                console.log(`✅ Found ${found.length} common-named images`);
                return found;
            }
            
            console.warn('⚠️ No images found, using fallback');
            return ['1.jpg', '2.jpg', '3.png', '4.jpg', '5.jpeg', '6.jpg', '7.jpg'];
        }

        // ── RENDER GALLERY ──
        function renderGallery() {
            grid.innerHTML = '';
            worksData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'work-card';
                card.innerHTML = `<img src="${item.image}" alt="Artwork ${index + 1}" class="card-img" loading="lazy" onerror="this.src='https://placehold.co/600x800/2a2520/ece4db?text=?'" />`;
                card.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openLightbox(index);
                });
                grid.appendChild(card);
            });
        }

        // ── RENDER STATIC SOCIAL ──
        function renderStaticSocial() {
            socialStatic.innerHTML = '';
            socialLinks.forEach(link => {
                const a = document.createElement('a');
                a.href = link.url;
                a.target = '_blank';
                a.className = 'social-link';
                a.innerHTML = `<i class="fab ${link.icon}"></i> ${link.label}`;
                socialStatic.appendChild(a);
            });
        }

        // ── SLIDE NAVIGATION ──
        function goToSlide(index) {
            if (isAnimating || index === currentSlide) return;
            if (index < 0 || index >= totalSlides) return;
            
            isAnimating = true;
            currentSlide = index;
            
            slidesContainer.style.transform = `translateY(-${index * 100}vh)`;
            
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
            
            setTimeout(() => {
                isAnimating = false;
            }, 850);
        }

        // ── DOT CLICK ──
        dots.forEach((dot, index) => {
            dot.addEventListener('click', () => {
                if (!lightboxModal.classList.contains('active')) {
                    goToSlide(index);
                }
            });
            dot.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (!lightboxModal.classList.contains('active')) {
                    goToSlide(index);
                }
            });
        });

        // ── WHEEL SCROLL ──
        let wheelTimeout = false;
        document.addEventListener('wheel', (e) => {
            if (lightboxModal.classList.contains('active')) return;
            if (wheelTimeout) return;
            
            const direction = e.deltaY > 0 ? 1 : -1;
            const nextSlide = currentSlide + direction;
            
            if (nextSlide >= 0 && nextSlide < totalSlides) {
                wheelTimeout = true;
                goToSlide(nextSlide);
                setTimeout(() => {
                    wheelTimeout = false;
                }, 900);
            }
        }, { passive: true });

        // ── TOUCH SWIPE ──
        let touchStartY = 0;
        let touchStartTime = 0;

        document.addEventListener('touchstart', (e) => {
            if (lightboxModal.classList.contains('active')) return;
            touchStartY = e.changedTouches[0].screenY;
            touchStartTime = Date.now();
        }, { passive: true });

        document.addEventListener('touchend', (e) => {
            if (lightboxModal.classList.contains('active')) return;
            if (touchStartY === 0) return;
            
            const deltaY = touchStartY - e.changedTouches[0].screenY;
            const deltaTime = Date.now() - touchStartTime;
            
            if (Math.abs(deltaY) > 40 && deltaTime < 500) {
                const direction = deltaY > 0 ? 1 : -1;
                const nextSlide = currentSlide + direction;
                if (nextSlide >= 0 && nextSlide < totalSlides) {
                    goToSlide(nextSlide);
                }
            }
            touchStartY = 0;
        }, { passive: true });

        // ── KEYBOARD NAV ──
        document.addEventListener('keydown', (e) => {
            if (lightboxModal.classList.contains('active')) {
                if (e.key === 'Escape') closeLightbox();
                return;
            }
            
            if (e.key === 'ArrowDown' || e.key === 'ArrowRight') {
                e.preventDefault();
                goToSlide(currentSlide + 1);
            } else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') {
                e.preventDefault();
                goToSlide(currentSlide - 1);
            }
        });

        // ── LIGHTBOX ──
        function openLightbox(index) {
            lightboxImg.src = worksData[index].image;
            lightboxModal.classList.add('active');
            document.body.style.overflow = 'hidden';
            document.body.style.position = 'fixed';
        }

        function closeLightbox() {
            lightboxModal.classList.remove('active');
            document.body.style.overflow = '';
            document.body.style.position = '';
        }

        closeBtn.addEventListener('click', closeLightbox);
        lightboxModal.addEventListener('click', (e) => {
            if (e.target === lightboxModal) closeLightbox();
        });

        // ── SWIPE TO CLOSE LIGHTBOX ──
        let lbTouchStartY = 0;
        lightboxModal.addEventListener('touchstart', (e) => {
            lbTouchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        lightboxModal.addEventListener('touchend', (e) => {
            const deltaY = lbTouchStartY - e.changedTouches[0].screenY;
            if (Math.abs(deltaY) > 50) {
                closeLightbox();
            }
        }, { passive: true });

        // ── CANVAS BACKGROUND ──
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let w, h;

        function resizeCanvas() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class DoodleMark {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.size = Math.random() * 12 + 2;
                this.vx = (Math.random() - 0.5) * 0.15;
                this.vy = (Math.random() - 0.5) * 0.15;
                this.alpha = Math.random() * 0.05 + 0.01;
                this.shape = Math.floor(Math.random() * 4);
                this.angle = Math.random() * Math.PI * 2;
                this.vAngle = (Math.random() - 0.5) * 0.006;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.angle += this.vAngle;
                if (this.x < -30 || this.x > w + 30 || this.y < -30 || this.y > h + 30) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.strokeStyle = `rgba(42, 37, 32, ${this.alpha})`;
                ctx.lineWidth = 1;

                if (this.shape === 0) {
                    ctx.strokeRect(-this.size / 2, -this.size / 2, this.size, this.size);
                } else if (this.shape === 1) {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
                    ctx.stroke();
                } else if (this.shape === 2) {
                    ctx.beginPath();
                    ctx.moveTo(-this.size / 2, 0);
                    ctx.lineTo(this.size / 2, 0);
                    ctx.moveTo(0, -this.size / 2);
                    ctx.lineTo(0, this.size / 2);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.moveTo(0, -this.size / 2);
                    ctx.lineTo(this.size / 2, this.size / 2);
                    ctx.lineTo(-this.size / 2, this.size / 2);
                    ctx.closePath();
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        const marks = Array.from({ length: 25 }, () => new DoodleMark());

        function drawNoise() {
            const imageData = ctx.createImageData(w, h);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const n = Math.random() * 6;
                data[i] = n;
                data[i + 1] = n;
                data[i + 2] = n;
                data[i + 3] = Math.random() * 0.1;
            }
            ctx.putImageData(imageData, 0, 0);
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, w, h);
            marks.forEach(m => { m.update(); m.draw(); });
            if (Math.random() < 0.08) drawNoise();
            requestAnimationFrame(animateCanvas);
        }

        // ── INIT ──
        async function init() {
            const imageList = await discoverImages();
            worksData = imageList.map(file => ({ image: file }));
            renderGallery();
            renderStaticSocial();
            animateCanvas();
            
            slidesContainer.style.transform = 'translateY(0)';
        }

        init();
    </script>
</body>
</html>
