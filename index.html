<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maanas Adiyodi — Doodle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Patrick+Hand&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ... all your existing styles ... */
    </style>
</head>
<body>
    <!-- Canvas -->
    <canvas id="bgCanvas"></canvas>

    <div class="container">
        <!-- SLIDE 1: HERO -->
        <section class="slide hero" id="home">
            <div class="hero-left">
                <div class="hero-title">
                    <span class="title-text">Maanas</span>
                    <span class="title-text">Adiyodi</span>
                </div>
                <div class="sub">poster artifacts · experimental</div>
                <div class="scroll-hint">↓ scroll</div>
            </div>
        </section>

        <!-- SLIDE 2: WORKS -->
        <section class="slide works-section" id="works">
            <div class="section-header">
                <h2>Works</h2>
            </div>
            <div class="grid" id="dynamicGrid"></div>
        </section>

        <!-- SLIDE 3: CONTACT -->
        <section class="slide contact-slide" id="contact">
            <div class="contact-title"><span>let's create</span></div>
            <div class="contact-divider"></div>
            <div class="contact-item">
                <i class="fa-regular fa-envelope"></i>
                <a href="mailto:maanas.rsuresh@gmail.com">maanas.rsuresh@gmail.com</a>
            </div>
            <div class="social-scroll-container">
                <div class="social-scroll-track" id="socialTrack">
                    <!-- injected by JS -->
                </div>
            </div>
        </section>
    </div>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightboxModal">
        <div class="lb-container">
            <button class="lb-close" id="closeLightboxBtn"><i class="fa-solid fa-xmark"></i></button>
            <img class="lb-img" id="lightboxImage" alt="Enlarged artwork" />
        </div>
    </div>

    <script>
        // ── SMART IMAGE LOADER FOR GITHUB PAGES ──
        async function getImageList() {
            // Try 1: Load from manifest.json (auto-generated by GitHub Action)
            try {
                const response = await fetch('./manifest.json');
                if (response.ok) {
                    const images = await response.json();
                    if (Array.isArray(images) && images.length > 0) {
                        console.log(`📸 Found ${images.length} images via manifest`);
                        return images;
                    }
                }
            } catch (e) { /* fall through */ }

            // Try 2: Auto-detect numbered images (1.jpg, 2.png, etc.)
            try {
                const extensions = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg', 'avif', 'bmp'];
                const found = [];
                
                for (let i = 1; i <= 50; i++) {
                    let foundAny = false;
                    for (const ext of extensions) {
                        const filename = `${i}.${ext}`;
                        try {
                            const resp = await fetch(filename, { method: 'HEAD' });
                            if (resp.ok) {
                                found.push(filename);
                                foundAny = true;
                                break;
                            }
                        } catch (e) { /* skip */ }
                    }
                    if (!foundAny && found.length > 0) break;
                }
                
                if (found.length > 0) {
                    console.log(`📸 Auto-detected ${found.length} numbered images`);
                    return found;
                }
            } catch (e) { /* fall through */ }

            // Try 3: Try common image names
            try {
                const common = ['cover', 'banner', 'main', 'hero', 'featured', '1'];
                const extensions = ['jpg', 'jpeg', 'png', 'gif', 'webp'];
                const found = [];
                
                for (const name of common) {
                    for (const ext of extensions) {
                        const filename = `${name}.${ext}`;
                        try {
                            const resp = await fetch(filename, { method: 'HEAD' });
                            if (resp.ok) {
                                found.push(filename);
                                break;
                            }
                        } catch (e) { /* skip */ }
                    }
                }
                
                if (found.length > 0) {
                    console.log(`📸 Found ${found.length} common-named images`);
                    return found;
                }
            } catch (e) { /* fall through */ }

            // Fallback: Hardcoded list
            console.warn('⚠️ Using fallback image list');
            return ['1.jpg', '2.jpg', '3.png', '4.jpg', '5.jpeg', '6.jpg', '7.jpg'];
        }

        // ── MAIN INIT ──
        const socialLinks = [
            { icon: 'fa-instagram', label: '@adichitodi', url: 'https://instagram.com/adichitodi' },
            { icon: 'fa-pinterest', label: 'Pinterest', url: 'https://www.pinterest.com/des1gnanythin/' },
        ];

        let currentLightboxIndex = 0;
        let worksData = [];

        const grid = document.getElementById('dynamicGrid');
        const lightboxModal = document.getElementById('lightboxModal');
        const lightboxImg = document.getElementById('lightboxImage');
        const closeBtn = document.getElementById('closeLightboxBtn');
        const socialTrack = document.getElementById('socialTrack');

        // ── RENDER GALLERY ──
        function renderGallery() {
            grid.innerHTML = '';
            worksData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'work-card';
                card.innerHTML =
                    `<img src="${item.image}" alt="Artwork ${index + 1}" class="card-img" loading="lazy" onerror="this.src='https://placehold.co/600x800/2a2520/ece4db?text=?'" />`;
                card.addEventListener('click', () => openLightbox(index));
                grid.appendChild(card);
            });
        }

        // ── RENDER SOCIAL SCROLL ──
        function renderSocialScroll() {
            const doubled = [...socialLinks, ...socialLinks];
            socialTrack.innerHTML = '';
            doubled.forEach(link => {
                const a = document.createElement('a');
                a.href = link.url;
                a.target = '_blank';
                a.className = 'social-link';
                a.innerHTML = `<i class="fab ${link.icon}"></i> ${link.label}`;
                socialTrack.appendChild(a);
            });
        }

        // ── LIGHTBOX ──
        function openLightbox(index) {
            currentLightboxIndex = index;
            lightboxImg.src = worksData[currentLightboxIndex].image;
            lightboxModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightboxModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        closeBtn.addEventListener('click', closeLightbox);
        lightboxModal.addEventListener('click', (e) => {
            if (e.target === lightboxModal) closeLightbox();
        });
        document.addEventListener('keydown', (e) => {
            if (!lightboxModal.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
        });

        // ── CANVAS (doodle marks) ──
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let w, h;

        function resizeCanvas() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class DoodleMark {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.size = Math.random() * 14 + 3;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = (Math.random() - 0.5) * 0.2;
                this.alpha = Math.random() * 0.06 + 0.015;
                this.shape = Math.floor(Math.random() * 4);
                this.angle = Math.random() * Math.PI * 2;
                this.vAngle = (Math.random() - 0.5) * 0.008;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.angle += this.vAngle;
                if (this.x < -30 || this.x > w + 30 || this.y < -30 || this.y > h + 30) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.strokeStyle = `rgba(42, 37, 32, ${this.alpha})`;
                ctx.lineWidth = 1.2;

                if (this.shape === 0) {
                    ctx.strokeRect(-this.size / 2, -this.size / 2, this.size, this.size);
                } else if (this.shape === 1) {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
                    ctx.stroke();
                } else if (this.shape === 2) {
                    ctx.beginPath();
                    ctx.moveTo(-this.size / 2, 0);
                    ctx.lineTo(this.size / 2, 0);
                    ctx.moveTo(0, -this.size / 2);
                    ctx.lineTo(0, this.size / 2);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.moveTo(0, -this.size / 2);
                    ctx.lineTo(this.size / 2, this.size / 2);
                    ctx.lineTo(-this.size / 2, this.size / 2);
                    ctx.closePath();
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        const marks = Array.from({ length: 30 }, () => new DoodleMark());

        function drawNoise() {
            const imageData = ctx.createImageData(w, h);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const n = Math.random() * 8;
                data[i] = n;
                data[i + 1] = n;
                data[i + 2] = n;
                data[i + 3] = Math.random() * 0.12;
            }
            ctx.putImageData(imageData, 0, 0);
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, w, h);
            marks.forEach(m => { m.update();
                m.draw(); });
            if (Math.random() < 0.1) drawNoise();
            requestAnimationFrame(animateCanvas);
        }

        // ── INIT ──
        async function init() {
            const imageList = await getImageList();
            worksData = imageList.map(file => ({ image: file }));
            renderGallery();
            renderSocialScroll();
            animateCanvas();
        }

        init();
    </script>
</body>
</html>
