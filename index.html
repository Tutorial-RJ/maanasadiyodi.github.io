<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maanas Adiyodi — Doodle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ── RESET ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ── VARIABLES ── */
        :root {
            --bg: #faf8f4;
            --bg-dark: #1a1714;
            --text: #2a2520;
            --text-dark: #ece4db;
            --text-muted: #7a7268;
            --paper: #fffcf7;
            --accent: #d97a4a;
            --accent2: #4a8c7a;
            --accent3: #c95a3a;
            --border: 2.5px solid #2a2520;
            --border-dark: 2.5px solid #ece4db;
            --shadow: 6px 6px 0px #2a2520;
            --shadow-dark: 6px 6px 0px #ece4db;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 1.5rem;
            min-height: 100vh;
            transition: background 0.3s ease, color 0.3s ease;
        }

        body.dark {
            --bg: #1a1714;
            --text: #ece4db;
            --text-muted: #a89a8e;
            --paper: #24201c;
            --border: 2.5px solid #ece4db;
            --border-dark: 2.5px solid #ece4db;
            --shadow: 6px 6px 0px #ece4db;
            --shadow-dark: 6px 6px 0px #ece4db;
            --accent: #d97a4a;
            --accent2: #5a9c8a;
            --accent3: #c95a3a;
        }

        body.dark {
            background: var(--bg);
            color: var(--text);
        }

        /* ── CANVAS (doodle texture) ── */
        #bgCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.25;
            mix-blend-mode: multiply;
        }
        body.dark #bgCanvas {
            opacity: 0.15;
            mix-blend-mode: screen;
        }

        /* ── LAYOUT ── */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ── THEME TOGGLE (doodle style) ── */
        .theme-toggle {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 999;
            background: var(--paper);
            color: var(--text);
            border: var(--border);
            box-shadow: var(--shadow);
            padding: 0.4rem 0.9rem;
            font-family: 'Patrick Hand', cursive;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.15s ease;
            transform: rotate(-2deg);
        }
        .theme-toggle:hover {
            transform: rotate(2deg) scale(1.05);
            background: var(--accent);
            color: #fff;
        }

        /* ── HERO (doodle style) ── */
        .hero {
            padding: 2.5rem 0 3rem;
            border-bottom: var(--border);
            margin-bottom: 3rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: flex-end;
            gap: 1.5rem;
            position: relative;
        }

        /* doodle squiggle */
        .hero::after {
            content: "~~~~~~~~";
            position: absolute;
            bottom: -0.8rem;
            right: 2rem;
            font-size: 1.2rem;
            color: var(--accent);
            letter-spacing: 0.2rem;
            opacity: 0.4;
            font-family: 'Patrick Hand', cursive;
        }

        .hero-left h1 {
            font-family: 'Patrick Hand', cursive;
            font-size: clamp(3.2rem, 10vw, 5.5rem);
            font-weight: 400;
            line-height: 0.95;
            letter-spacing: -0.02em;
            margin-bottom: 0.2rem;
            position: relative;
        }

        /* doodle underline */
        .hero-left h1::after {
            content: "";
            position: absolute;
            bottom: 0.2rem;
            left: 0;
            width: 100%;
            height: 6px;
            background: var(--accent);
            opacity: 0.3;
            border-radius: 50%;
            transform: rotate(-1deg);
        }

        .hero-left .sub {
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 0.04em;
            font-weight: 400;
            margin-top: 0.3rem;
        }

        .hero-right {
            text-align: right;
            flex-shrink: 0;
        }

        .hero-right .tag {
            display: inline-block;
            font-family: 'Patrick Hand', cursive;
            font-size: 0.9rem;
            color: var(--text-muted);
            border: var(--border);
            box-shadow: var(--shadow);
            padding: 0.3rem 1rem;
            transform: rotate(2deg);
            background: var(--paper);
        }
        .hero-right .tag span {
            color: var(--accent);
        }

        /* ── SOCIAL (doodle) ── */
        .social-row {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .social-link {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-family: 'Patrick Hand', cursive;
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text);
            text-decoration: none;
            border: var(--border);
            box-shadow: var(--shadow);
            padding: 0.2rem 0.9rem;
            background: var(--paper);
            transition: all 0.15s ease;
            transform: rotate(var(--rot, 0deg));
        }
        .social-link:nth-child(odd) { --rot: -1.5deg; }
        .social-link:nth-child(even) { --rot: 1.5deg; }
        .social-link:hover {
            transform: rotate(0deg) scale(1.04);
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .social-link i {
            font-size: 0.8rem;
        }

        /* ── WORKS ── */
        .works-section {
            padding-bottom: 3rem;
        }

        .section-header {
            display: flex;
            align-items: baseline;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2.5rem;
            padding-bottom: 0.6rem;
            border-bottom: var(--border);
            position: relative;
        }

        .section-header::after {
            content: "⚡⚡⚡";
            position: absolute;
            bottom: -0.6rem;
            right: 0;
            font-size: 0.8rem;
            color: var(--accent2);
            letter-spacing: 0.3rem;
            opacity: 0.3;
        }

        .section-header h2 {
            font-family: 'Patrick Hand', cursive;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        .section-header .count {
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.06em;
            border: var(--border);
            padding: 0.05rem 0.6rem;
            background: var(--paper);
            transform: rotate(-1deg);
        }

        /* ── GRID ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.2rem;
        }

        @media (min-width: 700px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 1.8rem;
            }
        }

        /* ── CARD (doodle style) ── */
        .work-card {
            background: var(--paper);
            border: var(--border);
            box-shadow: var(--shadow);
            cursor: pointer;
            overflow: hidden;
            transition: all 0.2s ease;
            transform: rotate(var(--rot, 0deg));
            position: relative;
        }

        .work-card:nth-child(5n+1) { --rot: -1.5deg; }
        .work-card:nth-child(5n+2) { --rot: 2deg; }
        .work-card:nth-child(5n+3) { --rot: -0.8deg; }
        .work-card:nth-child(5n+4) { --rot: 1.8deg; }
        .work-card:nth-child(5n+5) { --rot: -2.2deg; }

        .work-card:hover {
            transform: scale(1.03) rotate(0deg) !important;
            box-shadow: 8px 8px 0px var(--accent);
        }

        /* doodle corner accent */
        .work-card::before {
            content: "✦";
            position: absolute;
            top: -0.3rem;
            right: -0.3rem;
            font-size: 1.2rem;
            color: var(--accent2);
            opacity: 0.5;
            transform: rotate(12deg);
            z-index: 2;
        }

        .card-img {
            width: 100%;
            height: auto;
            display: block;
            vertical-align: bottom;
            filter: grayscale(0.1);
            transition: filter 0.25s ease;
        }
        .work-card:hover .card-img {
            filter: grayscale(0);
        }

        /* ── LIGHTBOX ── */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .lightbox.active {
            display: flex;
        }

        .lb-container {
            position: relative;
            max-width: 92vw;
            max-height: 90vh;
        }

        .lb-img {
            max-width: 100%;
            max-height: 82vh;
            object-fit: contain;
            border: var(--border-dark);
            box-shadow: 12px 12px 0px var(--accent);
            background: var(--paper);
        }

        .lb-close,
        .lb-nav {
            background: var(--paper);
            color: var(--text);
            border: var(--border-dark);
            box-shadow: var(--shadow-dark);
            font-size: 1rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            position: absolute;
            font-family: 'Patrick Hand', cursive;
        }
        .lb-close:hover,
        .lb-nav:hover {
            background: var(--accent);
            color: #fff;
            transform: scale(1.08);
        }

        .lb-close {
            top: -0.5rem;
            right: -0.5rem;
        }
        .lb-prev {
            left: -0.5rem;
            top: 50%;
            transform: translateY(-50%);
        }
        .lb-next {
            right: -0.5rem;
            top: 50%;
            transform: translateY(-50%);
        }

        /* ── FOOTER (doodle) ── */
        .footer {
            border-top: var(--border);
            padding: 2rem 0 1.5rem;
            margin-top: 1rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            position: relative;
        }

        .footer::before {
            content: "✧ ✧ ✧";
            position: absolute;
            top: -0.6rem;
            left: 30%;
            font-size: 0.8rem;
            color: var(--accent3);
            opacity: 0.3;
            letter-spacing: 0.5rem;
        }

        .footer-left {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1.2rem;
        }

        .footer-left .tagline {
            font-family: 'Patrick Hand', cursive;
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        .footer-email a {
            font-family: 'Patrick Hand', cursive;
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text);
            text-decoration: none;
            border-bottom: 3px dotted var(--accent);
            padding-bottom: 0.05rem;
            transition: border-color 0.2s;
        }
        .footer-email a:hover {
            border-color: var(--text);
        }

        .footer-right {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .footer-right .copy {
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.04em;
            font-family: 'Patrick Hand', cursive;
        }

        .footer-right .social-link {
            font-size: 0.75rem;
            padding: 0.15rem 0.7rem;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 700px) {
            body { padding: 1rem; }

            .hero {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.8rem;
                padding-top: 1.5rem;
                padding-bottom: 2rem;
            }
            .hero::after {
                right: 0.5rem;
                font-size: 0.8rem;
            }
            .hero-right {
                text-align: left;
                width: 100%;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 0.8rem;
            }

            .work-card {
                --rot: 0deg !important;
            }
            .work-card::before {
                display: none;
            }

            .footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.8rem;
            }
            .footer::before {
                left: 10%;
            }
            .footer-right {
                width: 100%;
                justify-content: flex-start;
            }

            .lb-close {
                top: 0.2rem;
                right: 0.2rem;
                width: 34px;
                height: 34px;
                font-size: 0.8rem;
            }
            .lb-prev,
            .lb-next {
                width: 34px;
                height: 34px;
                font-size: 0.8rem;
            }
            .lb-prev {
                left: 0.2rem;
            }
            .lb-next {
                right: 0.2rem;
            }

            .theme-toggle {
                bottom: 1rem;
                right: 1rem;
                padding: 0.3rem 0.7rem;
                font-size: 0.8rem;
            }
        }

        @media (max-width: 450px) {
            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.6rem;
            }
            .hero-left h1 {
                font-size: clamp(2.4rem, 12vw, 3.2rem);
            }
            .hero-left h1::after {
                height: 4px;
                bottom: 0.1rem;
            }
            .section-header h2 {
                font-size: clamp(1.4rem, 6vw, 2rem);
            }
        }
    </style>
</head>
<body>

    <!-- Canvas -->
    <canvas id="bgCanvas"></canvas>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle">⚡ doodle</button>

    <div class="container">

        <!-- HERO -->
        <section class="hero">
            <div class="hero-left">
                <h1>Maanas<br />Adiyodi</h1>
                <div class="sub">poster artifacts · experimental</div>
                <div class="social-row">
                    <a href="https://instagram.com/adichitodi" target="_blank" class="social-link">
                        <i class="fab fa-instagram"></i> @adichitodi
                    </a>
                </div>
            </div>
            <div class="hero-right">
                <div class="tag"><span>✦</span> still &amp; motion</div>
            </div>
        </section>

        <!-- WORKS -->
        <section class="works-section">
            <div class="section-header">
                <h2>Works</h2>
                <span class="count">7 pieces</span>
            </div>
            <div class="grid" id="dynamicGrid"></div>
        </section>

        <!-- FOOTER -->
        <footer class="footer">
            <div class="footer-left">
                <span class="tagline">let's create</span>
                <div class="footer-email">
                    <a href="mailto:maanas.rsuresh@gmail.com">maanas.rsuresh@gmail.com</a>
                </div>
            </div>
            <div class="footer-right">
                <a href="https://instagram.com/adichitodi" target="_blank" class="social-link">
                    <i class="fab fa-instagram"></i> @adichitodi
                </a>
                <span class="copy">✦ 2026</span>
            </div>
        </footer>

    </div>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightboxModal">
        <div class="lb-container">
            <button class="lb-close" id="closeLightboxBtn"><i class="fa-solid fa-xmark"></i></button>
            <button class="lb-nav lb-prev" id="prevBtn"><i class="fa-solid fa-arrow-left"></i></button>
            <img class="lb-img" id="lightboxImage" alt="Enlarged artwork" />
            <button class="lb-nav lb-next" id="nextBtn"><i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </div>

    <script>
        // ── DATA ──
        const worksData = [
            { image: '1.jpg' },
            { image: '2.jpg' },
            { image: '3.png' },
            { image: '4.jpg' },
            { image: '5.jpeg' },
            { image: '6.jpg' },
            { image: '7.jpg' }
        ];

        // ── SHUFFLE ──
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        const shuffledWorks = shuffleArray([...worksData]);

        let currentLightboxIndex = 0;

        // ── DOM REFS ──
        const grid = document.getElementById('dynamicGrid');
        const lightboxModal = document.getElementById('lightboxModal');
        const lightboxImg = document.getElementById('lightboxImage');
        const closeBtn = document.getElementById('closeLightboxBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const themeBtn = document.getElementById('themeToggle');

        // ── RENDER ──
        function renderGallery() {
            grid.innerHTML = '';
            shuffledWorks.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'work-card';
                card.innerHTML =
                    `<img src="${item.image}" alt="Artwork ${index + 1}" class="card-img" loading="lazy" onerror="this.src='https://placehold.co/600x800/2a2520/ece4db?text=?'" />`;
                card.addEventListener('click', () => openLightbox(index));
                grid.appendChild(card);
            });
        }

        // ── LIGHTBOX ──
        function openLightbox(index) {
            currentLightboxIndex = index;
            lightboxImg.src = shuffledWorks[currentLightboxIndex].image;
            lightboxModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightboxModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        function navigateLightbox(dir) {
            currentLightboxIndex = (currentLightboxIndex + dir + shuffledWorks.length) % shuffledWorks.length;
            lightboxImg.src = shuffledWorks[currentLightboxIndex].image;
        }

        closeBtn.addEventListener('click', closeLightbox);
        prevBtn.addEventListener('click', () => navigateLightbox(-1));
        nextBtn.addEventListener('click', () => navigateLightbox(1));

        lightboxModal.addEventListener('click', (e) => {
            if (e.target === lightboxModal) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (!lightboxModal.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') navigateLightbox(1);
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
        });

        // ── THEME ──
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark');
        });

        // ── CANVAS (doodle marks) ──
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let w, h;

        function resizeCanvas() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class DoodleMark {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.size = Math.random() * 14 + 3;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = (Math.random() - 0.5) * 0.2;
                this.alpha = Math.random() * 0.06 + 0.015;
                this.shape = Math.floor(Math.random() * 4);
                this.angle = Math.random() * Math.PI * 2;
                this.vAngle = (Math.random() - 0.5) * 0.008;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.angle += this.vAngle;
                if (this.x < -30 || this.x > w + 30 || this.y < -30 || this.y > h + 30) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                const isDark = document.body.classList.contains('dark');
                ctx.strokeStyle = isDark ?
                    `rgba(220, 210, 200, ${this.alpha * 0.5})` :
                    `rgba(42, 37, 32, ${this.alpha})`;
                ctx.lineWidth = 1.2;

                if (this.shape === 0) {
                    // square
                    ctx.strokeRect(-this.size / 2, -this.size / 2, this.size, this.size);
                } else if (this.shape === 1) {
                    // circle
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
                    ctx.stroke();
                } else if (this.shape === 2) {
                    // cross
                    ctx.beginPath();
                    ctx.moveTo(-this.size / 2, 0);
                    ctx.lineTo(this.size / 2, 0);
                    ctx.moveTo(0, -this.size / 2);
                    ctx.lineTo(0, this.size / 2);
                    ctx.stroke();
                } else {
                    // triangle
                    ctx.beginPath();
                    ctx.moveTo(0, -this.size / 2);
                    ctx.lineTo(this.size / 2, this.size / 2);
                    ctx.lineTo(-this.size / 2, this.size / 2);
                    ctx.closePath();
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        const marks = Array.from({ length: 30 }, () => new DoodleMark());

        function drawNoise() {
            const imageData = ctx.createImageData(w, h);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const n = Math.random() * 8;
                data[i] = n;
                data[i + 1] = n;
                data[i + 2] = n;
                data[i + 3] = Math.random() * 0.12;
            }
            ctx.putImageData(imageData, 0, 0);
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, w, h);
            marks.forEach(m => { m.update();
                m.draw(); });
            if (Math.random() < 0.1) drawNoise();
            requestAnimationFrame(animateCanvas);
        }

        renderGallery();
        animateCanvas();
    </script>
</body>
</html>
