<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maanas Adiyodi — Doodle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Patrick+Hand&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ── RESET ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ── VARIABLES ── */
        :root {
            --bg: #faf8f4;
            --text: #2a2520;
            --text-muted: #7a7268;
            --paper: #fffcf7;
            --accent: #d97a4a;
            --accent2: #4a8c7a;
            --border: 2.5px solid #2a2520;
            --shadow: 6px 6px 0px #2a2520;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Instrument Serif', serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 1.5rem;
            min-height: 100vh;
        }

        /* ── CANVAS (doodle texture) ── */
        #bgCanvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            opacity: 0.25;
            mix-blend-mode: multiply;
        }

        /* ── LAYOUT ── */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ── SECTION (full page slides) ── */
        .slide {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2rem 0;
            border-bottom: var(--border);
            position: relative;
        }

        .slide:last-child {
            border-bottom: none;
        }

        .slide .section-label {
            font-family: 'Patrick Hand', cursive;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            opacity: 0.5;
        }

        /* ── HERO (centered) ── */
        .hero {
            padding: 2rem 0 3rem;
            text-align: center;
            position: relative;
        }

        /* doodle squiggle */
        .hero::after {
            content: "~~~~~~~~";
            position: absolute;
            bottom: -0.8rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
            color: var(--accent);
            letter-spacing: 0.2rem;
            opacity: 0.3;
            font-family: 'Patrick Hand', cursive;
        }

        .hero-title {
            display: inline-block;
            position: relative;
            margin-bottom: 0.2rem;
        }

        .hero-title .title-text {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(3rem, 10vw, 5.5rem);
            font-weight: 400;
            line-height: 0.9;
            background: linear-gradient(to bottom, #2a2520 0%, #d97a4a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: block;
            letter-spacing: -0.02em;
        }

        .hero-title .title-text:last-child {
            background: linear-gradient(to bottom, #2a2520 0%, #4a8c7a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* doodle underline */
        .hero-title::after {
            content: "";
            position: absolute;
            bottom: 0.2rem;
            left: 5%;
            width: 90%;
            height: 6px;
            background: var(--accent);
            opacity: 0.3;
            border-radius: 50%;
            transform: rotate(-1deg);
            pointer-events: none;
        }

        .hero-left .sub {
            font-family: 'Instrument Serif', serif;
            font-size: 1.1rem;
            color: var(--text-muted);
            letter-spacing: 0.04em;
            font-weight: 400;
            margin-top: 0.3rem;
        }

        /* ── SCROLL INDICATOR ── */
        .scroll-hint {
            margin-top: 2.5rem;
            font-family: 'Patrick Hand', cursive;
            font-size: 0.8rem;
            color: var(--text-muted);
            opacity: 0.5;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(6px); }
        }

        /* ── WORKS ── */
        .works-section {
            padding: 2rem 0;
        }

        .section-header {
            text-align: center;
            margin-bottom: 2.5rem;
            padding-bottom: 0.6rem;
            border-bottom: var(--border);
            position: relative;
        }

        .section-header::after {
            content: "⚡⚡⚡";
            position: absolute;
            bottom: -0.6rem;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: var(--accent2);
            letter-spacing: 0.3rem;
            opacity: 0.3;
        }

        .section-header h2 {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        /* ── GRID (centered) ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.2rem;
            justify-items: center;
        }

        @media (min-width: 700px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 1.8rem;
            }
        }

        /* ── CARD (doodle style, centered) ── */
        .work-card {
            background: var(--paper);
            border: var(--border);
            box-shadow: var(--shadow);
            cursor: pointer;
            overflow: hidden;
            transition: all 0.2s ease;
            transform: rotate(var(--rot, 0deg));
            position: relative;
            width: 100%;
            max-width: 320px;
        }

        .work-card:nth-child(5n+1) { --rot: -1.5deg; }
        .work-card:nth-child(5n+2) { --rot: 2deg; }
        .work-card:nth-child(5n+3) { --rot: -0.8deg; }
        .work-card:nth-child(5n+4) { --rot: 1.8deg; }
        .work-card:nth-child(5n+5) { --rot: -2.2deg; }

        .work-card:hover {
            transform: scale(1.03) rotate(0deg) !important;
            box-shadow: 8px 8px 0px var(--accent);
        }

        /* doodle corner accent */
        .work-card::before {
            content: "✦";
            position: absolute;
            top: -0.3rem;
            right: -0.3rem;
            font-size: 1.2rem;
            color: var(--accent2);
            opacity: 0.5;
            transform: rotate(12deg);
            z-index: 2;
        }

        .card-img {
            width: 100%;
            height: auto;
            display: block;
            vertical-align: bottom;
            filter: grayscale(0.1);
            transition: filter 0.25s ease;
        }
        .work-card:hover .card-img {
            filter: grayscale(0);
        }

        /* ── CONTACT SLIDE ── */
        .contact-slide {
            text-align: center;
            padding: 3rem 0;
        }

        .contact-slide .contact-title {
            font-family: 'Instrument Serif', serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 400;
            margin-bottom: 1.5rem;
            letter-spacing: 0.02em;
        }

        .contact-slide .contact-title span {
            background: linear-gradient(to bottom, #2a2520 0%, #d97a4a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .contact-divider {
            width: 60px;
            height: 3px;
            background: var(--accent);
            margin: 0 auto 2rem;
            opacity: 0.3;
            border-radius: 50%;
        }

        .contact-item {
            font-family: 'Instrument Serif', serif;
            font-size: 1.2rem;
            margin: 0.8rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            flex-wrap: wrap;
        }

        .contact-item a {
            color: var(--text);
            text-decoration: none;
            border-bottom: 2px dotted var(--accent);
            padding-bottom: 0.05rem;
            transition: border-color 0.2s;
        }

        .contact-item a:hover {
            border-color: var(--text);
        }

        .contact-item i {
            color: var(--accent);
            font-size: 1.1rem;
            width: 1.5rem;
            text-align: center;
        }

        /* ── SOCIAL SCROLL CONTAINER ── */
        .social-scroll-container {
            max-width: 400px;
            margin: 1.5rem auto 0;
            border: var(--border);
            box-shadow: var(--shadow);
            background: var(--paper);
            padding: 0.5rem 0;
            overflow: hidden;
            position: relative;
        }

        .social-scroll-container::before,
        .social-scroll-container::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            width: 30px;
            z-index: 2;
            pointer-events: none;
        }

        .social-scroll-container::before {
            left: 0;
            background: linear-gradient(to right, var(--paper), transparent);
        }

        .social-scroll-container::after {
            right: 0;
            background: linear-gradient(to left, var(--paper), transparent);
        }

        .social-scroll-track {
            display: flex;
            gap: 0.8rem;
            padding: 0.5rem 1rem;
            animation: scrollSocial 18s linear infinite;
            width: max-content;
        }

        .social-scroll-track .social-link {
            flex-shrink: 0;
            font-family: 'Instrument Serif', serif;
            font-size: 0.95rem;
            padding: 0.3rem 1.2rem;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text);
            text-decoration: none;
            border: var(--border);
            box-shadow: var(--shadow);
            background: var(--bg);
            transition: all 0.15s ease;
        }

        .social-scroll-track .social-link:hover {
            background: var(--accent);
            color: #fff;
            transform: scale(1.05);
        }

        .social-scroll-track .social-link i {
            font-size: 0.9rem;
        }

        @keyframes scrollSocial {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }

        .social-scroll-container:hover .social-scroll-track {
            animation-play-state: paused;
        }

        /* ── LIGHTBOX ── */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .lightbox.active {
            display: flex;
        }

        .lb-container {
            position: relative;
            max-width: 92vw;
            max-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lb-img {
            max-width: 100%;
            max-height: 82vh;
            object-fit: contain;
            border: var(--border);
            box-shadow: 12px 12px 0px var(--accent);
            background: var(--paper);
        }

        .lb-close {
            background: var(--paper);
            color: var(--text);
            border: var(--border);
            box-shadow: var(--shadow);
            font-size: 1rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            position: absolute;
            font-family: 'Instrument Serif', serif;
            top: -0.5rem;
            right: -0.5rem;
            z-index: 10;
        }
        .lb-close:hover {
            background: var(--accent);
            color: #fff;
            transform: scale(1.08);
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 700px) {
            body { padding: 1rem; }

            .slide {
                min-height: 60vh;
                padding: 1.5rem 0;
            }

            .hero {
                padding-top: 1.5rem;
                padding-bottom: 2rem;
            }
            .hero::after {
                font-size: 0.8rem;
            }

            .hero-title .title-text {
                font-size: clamp(2.4rem, 8vw, 3.8rem);
            }
            .hero-title::after {
                height: 4px;
                bottom: 0.1rem;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 0.8rem;
            }

            .work-card {
                --rot: 0deg !important;
                max-width: 280px;
            }
            .work-card::before {
                display: none;
            }

            .contact-item {
                font-size: 1rem;
            }

            .social-scroll-container {
                max-width: 90%;
            }
            .social-scroll-track .social-link {
                font-size: 0.8rem;
                padding: 0.2rem 0.9rem;
            }
        }

        @media (max-width: 450px) {
            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.6rem;
            }

            .hero-title .title-text {
                font-size: clamp(1.8rem, 7vw, 2.8rem);
            }

            .section-header h2 {
                font-size: clamp(1.6rem, 6vw, 2.2rem);
            }
            .work-card {
                max-width: 200px;
            }

            .contact-slide .contact-title {
                font-size: clamp(2rem, 8vw, 2.8rem);
            }
            .contact-item {
                font-size: 0.9rem;
            }
            .social-scroll-track .social-link {
                font-size: 0.7rem;
                padding: 0.15rem 0.7rem;
            }
        }

        @media (max-width: 380px) {
            .hero-title .title-text {
                font-size: clamp(1.4rem, 6vw, 2.2rem);
            }
            .grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.5rem;
            }
            .work-card {
                max-width: 150px;
            }
        }
    </style>
</head>
<body>

    <!-- Canvas -->
    <canvas id="bgCanvas"></canvas>

    <div class="container">

        <!-- SLIDE 1: HERO -->
        <section class="slide hero" id="home">
            <div class="hero-left">
                <div class="hero-title">
                    <span class="title-text">Maanas</span>
                    <span class="title-text">Adiyodi</span>
                </div>
                <div class="sub">poster artifacts · experimental</div>
                <div class="scroll-hint">↓ scroll</div>
            </div>
        </section>

        <!-- SLIDE 2: WORKS -->
        <section class="slide works-section" id="works">
            <div class="section-header">
                <h2>Works</h2>
            </div>
            <div class="grid" id="dynamicGrid"></div>
        </section>

        <!-- SLIDE 3: CONTACT -->
        <section class="slide contact-slide" id="contact">
            <div class="contact-title"><span>let's create</span></div>
            <div class="contact-divider"></div>

            <div class="contact-item">
                <i class="fa-regular fa-envelope"></i>
                <a href="mailto:maanas.rsuresh@gmail.com">maanas.rsuresh@gmail.com</a>
            </div>

            <div class="social-scroll-container">
                <div class="social-scroll-track" id="socialTrack">
                    <!-- injected by JS -->
                </div>
            </div>
        </section>

    </div>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightboxModal">
        <div class="lb-container">
            <button class="lb-close" id="closeLightboxBtn"><i class="fa-solid fa-xmark"></i></button>
            <img class="lb-img" id="lightboxImage" alt="Enlarged artwork" />
        </div>
    </div>

    <script>
        // ── DATA ──
        // Images are loaded from root directory with their natural aspect ratios
        const worksData = [
            { image: '1.jpg' },
            { image: '2.jpg' },
            { image: '3.png' },
            { image: '4.jpg' },
            { image: '5.jpeg' },
            { image: '6.jpg' },
            { image: '7.jpg' }
        ];

        const socialLinks = [
            { icon: 'fa-instagram', label: '@adichitodi', url: 'https://instagram.com/adichitodi' },
            { icon: 'fa-pinterest', label: 'Pinterest', url: 'https://www.pinterest.com/des1gnanythin/' },
        ];

        // ── SHUFFLE ──
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        const shuffledWorks = shuffleArray([...worksData]);

        let currentLightboxIndex = 0;

        // ── DOM REFS ──
        const grid = document.getElementById('dynamicGrid');
        const lightboxModal = document.getElementById('lightboxModal');
        const lightboxImg = document.getElementById('lightboxImage');
        const closeBtn = document.getElementById('closeLightboxBtn');
        const socialTrack = document.getElementById('socialTrack');

        // ── RENDER GALLERY ──
        function renderGallery() {
            grid.innerHTML = '';
            shuffledWorks.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'work-card';
                card.innerHTML =
                    `<img src="${item.image}" alt="Artwork ${index + 1}" class="card-img" loading="lazy" onerror="this.src='https://placehold.co/600x800/2a2520/ece4db?text=?'" />`;
                card.addEventListener('click', () => openLightbox(index));
                grid.appendChild(card);
            });
        }

        // ── RENDER SOCIAL SCROLL ──
        function renderSocialScroll() {
            // Double the items for seamless looping
            const doubled = [...socialLinks, ...socialLinks];
            socialTrack.innerHTML = '';
            doubled.forEach(link => {
                const a = document.createElement('a');
                a.href = link.url;
                a.target = '_blank';
                a.className = 'social-link';
                a.innerHTML = `<i class="fab ${link.icon}"></i> ${link.label}`;
                socialTrack.appendChild(a);
            });
        }

        // ── LIGHTBOX (no nav buttons, just close) ──
        function openLightbox(index) {
            currentLightboxIndex = index;
            lightboxImg.src = shuffledWorks[currentLightboxIndex].image;
            lightboxModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightboxModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        closeBtn.addEventListener('click', closeLightbox);

        lightboxModal.addEventListener('click', (e) => {
            if (e.target === lightboxModal) closeLightbox();
        });

        document.addEventListener('keydown', (e) => {
            if (!lightboxModal.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
        });

        // ── CANVAS (doodle marks) ──
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        let w, h;

        function resizeCanvas() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class DoodleMark {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.size = Math.random() * 14 + 3;
                this.vx = (Math.random() - 0.5) * 0.2;
                this.vy = (Math.random() - 0.5) * 0.2;
                this.alpha = Math.random() * 0.06 + 0.015;
                this.shape = Math.floor(Math.random() * 4);
                this.angle = Math.random() * Math.PI * 2;
                this.vAngle = (Math.random() - 0.5) * 0.008;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.angle += this.vAngle;
                if (this.x < -30 || this.x > w + 30 || this.y < -30 || this.y > h + 30) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.strokeStyle = `rgba(42, 37, 32, ${this.alpha})`;
                ctx.lineWidth = 1.2;

                if (this.shape === 0) {
                    ctx.strokeRect(-this.size / 2, -this.size / 2, this.size, this.size);
                } else if (this.shape === 1) {
                    ctx.beginPath();
                    ctx.arc(0, 0, this.size / 2, 0, Math.PI * 2);
                    ctx.stroke();
                } else if (this.shape === 2) {
                    ctx.beginPath();
                    ctx.moveTo(-this.size / 2, 0);
                    ctx.lineTo(this.size / 2, 0);
                    ctx.moveTo(0, -this.size / 2);
                    ctx.lineTo(0, this.size / 2);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.moveTo(0, -this.size / 2);
                    ctx.lineTo(this.size / 2, this.size / 2);
                    ctx.lineTo(-this.size / 2, this.size / 2);
                    ctx.closePath();
                    ctx.stroke();
                }
                ctx.restore();
            }
        }

        const marks = Array.from({ length: 30 }, () => new DoodleMark());

        function drawNoise() {
            const imageData = ctx.createImageData(w, h);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
                const n = Math.random() * 8;
                data[i] = n;
                data[i + 1] = n;
                data[i + 2] = n;
                data[i + 3] = Math.random() * 0.12;
            }
            ctx.putImageData(imageData, 0, 0);
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, w, h);
            marks.forEach(m => { m.update();
                m.draw(); });
            if (Math.random() < 0.1) drawNoise();
            requestAnimationFrame(animateCanvas);
        }

        // ── INIT ──
        renderGallery();
        renderSocialScroll();
        animateCanvas();
    </script>
</body>
</html>
